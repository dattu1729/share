apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-registry
  labels:
    {{- include "mcp-registry.labels" . | nindent 4 }}
spec:
  type: {{ .Values.registry.service.type }}
  selector:
    {{- include "mcp-registry.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.registry.service.port }}
      targetPort: 8080
      protocol: TCP
