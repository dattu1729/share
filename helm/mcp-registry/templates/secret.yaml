apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-registry
  labels:
    {{- include "mcp-registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCP_REGISTRY_DATABASE_URL: {{ include "mcp-registry.databaseUrl" . | quote }}
  MCP_REGISTRY_JWT_PRIVATE_KEY: {{ .Values.registry.jwtPrivateKey | quote }}
  MCP_REGISTRY_GITHUB_CLIENT_ID: {{ .Values.registry.github.clientId | quote }}
  MCP_REGISTRY_GITHUB_CLIENT_SECRET: {{ .Values.registry.github.clientSecret | quote }}
